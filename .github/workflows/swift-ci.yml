name: Swift Native Pipeline

on:
  schedule:
    # Wakes up at 29 minutes past 2 AM, 8 AM, 2 PM, and 8 PM UTC
    # (10:29 AM, 4:29 PM, 10:29 PM, and 4:29 AM Singapore Time)
    - cron: '29 2,8,14,20 * * *'
  workflow_dispatch:

jobs:
  swift-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch iOS Source
        uses: actions/checkout@v4

      - name: Mutate Swift Struct Definitions
        run: |
          # 30% chance to skip (maintains organic execution flow)
          if [ $((RANDOM % 100)) -lt 30 ]; then
            echo "Swift models current. Skipping execution."
            exit 0
          fi

          mkdir -p Sources/App/Models
          TARGET_FILE="Sources/App/Models/AppState.swift"

          if [ ! -f "$TARGET_FILE" ]; then
            echo "import Foundation" > "$TARGET_FILE"
            echo "" >> "$TARGET_FILE"
            echo "// Core iOS State Models" >> "$TARGET_FILE"
          fi

          COMPONENTS=("NavigationState" "UserSession" "ThemePalette" "MetricPayload" "FeatureFlag")
          PICKED_COMP=${COMPONENTS[$RANDOM % ${#COMPONENTS[@]}]}

          echo "" >> "$TARGET_FILE"
          echo "/// State representation node $RANDOM" >> "$TARGET_FILE"
          echo "public struct ${PICKED_COMP}_$RANDOM: Identifiable, Codable {" >> "$TARGET_FILE"
          echo "    public let id = UUID()" >> "$TARGET_FILE"
          echo "    public var isActive: Bool = true" >> "$TARGET_FILE"
          echo "    public var nodeCode: Int = $RANDOM" >> "$TARGET_FILE"
          echo "}" >> "$TARGET_FILE"

          git config --global user.name "benji280180"
          git config --global user.email "benji280180@gmail.com"

          MESSAGES=(
            "feat: add Swift Codable struct representation for app state"
            "refactor: optimize Swift model Codable properties"
            "fix: update Identifiable protocol mapping on iOS models"
            "chore: sync SwiftUI view model state definitions"
          )
          MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

          git add Sources/
          git commit -m "$MSG"
          git push
